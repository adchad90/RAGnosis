[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagnostic-ai"
version = "0.1.0"
description = "AI agent for proactive clinical diagnostics using RAG and LangGraph"
requires-python = ">=3.11"
authors = [
    {name = "Aditya Chavan", email = "iaditya.2016@gmail.com"},
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "faiss-cpu>=1.8.0",
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "streamlit>=1.28.0",
    "reportlab>=4.0.0", 
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ipython>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.hatch.build.targets.wheel]
packages = ["src/diagnostic_ai"]